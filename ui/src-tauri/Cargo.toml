[package]
name = "final-approach-desktop"
version = "0.1.0"
description = "Desktop wrapper for Final Approach"
edition = "2021"

[lib]
name = "final_approach_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "final-approach-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

