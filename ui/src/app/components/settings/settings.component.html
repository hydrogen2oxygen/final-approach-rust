<h2 mat-dialog-title>Settings</h2>
<mat-dialog-content>

  <div style="display: flex; gap: 2rem;">
    <div class="col">

      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text" id="congregationName">Congregation Name</span>
        <input type="text" class="form-control" [formControl]="congregationName">
      </div>

      <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea id="notes" class="form-control form-control-sm" placeholder="Notes" [formControl]="note"></textarea>

      </div>
    </div>
    <div class="col">
      ...
    </div>
  </div>
  <button class="btn btn-success" mat-dialog-close (click)="save()">Save</button>
</mat-dialog-content>
