<div class="dialog-header">
  <h2>{{ data.title }}</h2>
  <button class="close-button" type="button" mat-dialog-close aria-label="Close dialog">&times;</button>
</div>

<mat-dialog-content>
  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>ACTIONS</th>
        <th>NAME</th>
        <th>TERRITORIES</th>
        <th>LINK</th>
      </tr>
      </thead>
      <tbody>
        @for (preacher of data.preachers; track preacher) {
          <tr>
            <td class="actions-cell">
              <button class="action-button delete-button" type="button"
                      (click)="data.deletePreacher(preacher)">DEL</button>
              <button class="action-button switch-button" type="button"
                      (click)="data.switchGroup(preacher)">SWITCH</button>
            </td>
            <td>
              <button class="action-button primary-button preacher-button" type="button"
                      (click)="data.openTerritories(preacher)">{{ preacher.name }}</button>
            </td>
            <td class="territory-count">{{ data.getAssignedTerritoryCount(preacher) }}</td>
            <td>
              <button class="action-button primary-button" type="button"
                      (click)="data.copyLink(preacher)">COPY URL</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</mat-dialog-content>
