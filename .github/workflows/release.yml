name: Release desktop application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui/src-tauri

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Angular application
        working-directory: ui
        run: npm run build

      - name: Prepare Tauri sidecar
        working-directory: ui
        run: npm run tauri:prepare

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Final Approach v__VERSION__'
          releaseBody: 'See the release notes and attached installers.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi
